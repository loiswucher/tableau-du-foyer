name: Construire APK + version iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── APK Android (téléphone de Loïs) ────────────────────────────────
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Compiler l'appli web
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Créer le projet Android (Capacitor)
        run: npx cap add android

      - name: Générer les icônes de l'appli
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#4CAF6D' --iconBackgroundColorDark '#1F3A4D' --splashBackgroundColor '#E8EEF2' --splashBackgroundColorDark '#1F3A4D'

      - name: Ajouter les icônes de notification
        run: cp -r native-res/. android/app/src/main/res/

      - name: Fixer la clé de signature (stable entre les builds)
        run: |
          cp keystore/debug.keystore android/app/debug.keystore
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          printf '\nandroid {\n  signingConfigs {\n    debug {\n      storeFile file("debug.keystore")\n      storePassword "android"\n      keyAlias "androiddebugkey"\n      keyPassword "android"\n    }\n  }\n}\n' >> android/app/build.gradle

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK (onglet Actions → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: tableau-du-foyer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ── Version web pour l'iPhone de Vanessa (GitHub Pages) ────────────
  web:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
